settings:
  allow-end: true
  warn-on-overload: true
  permissions-file: permissions.yml
  update-folder: update
  plugin-profiling: false
  connection-throttle: 4000
  query-plugins: true
  deprecated-verbose: default
spawn-limits:
  monsters: 35
  animals: 8
  water-animals: 3
  ambient: 1
chunk-gc:
  period-in-ticks: 600
  load-threshold: 0
ticks-per:
  animal-spawns: 400
  monster-spawns: 20
  water-spawns: 400
  ambient-spawns: 800
  autosave: 6000
aliases: {}
